<svg xmlns="http://www.w3.org/2000/svg" width="840" height="220" viewBox="0 0 840 220" role="img" aria-label="Karan Nishchal — Data Scientist / ML Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e18"/>
      <stop offset="1" stop-color="#0f1626"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38e1c4"/>
      <stop offset="0.55" stop-color="#6a8cff"/>
      <stop offset="1" stop-color="#c774ff"/>
    </linearGradient>
    <style>
      .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;}
      .line{opacity:1;}
      .l1{animation:show .5s ease .3s both;}
      .l2{animation:show .5s ease 1.1s both;}
      .l3{animation:show .5s ease 1.9s both;}
      .l4{animation:show .5s ease 2.7s both;}
      @keyframes show{from{opacity:0;transform:translateX(-6px);}to{opacity:1;transform:translateX(0);}}
      .cursor{animation:blink 1.05s steps(1) infinite;}
      @keyframes blink{50%{opacity:0;}}
      .type1{animation:t1 .8s steps(18) .4s both;}
      @keyframes t1{from{width:0;}to{width:230px;}}
    </style>
  </defs>

  <rect x="0" y="0" width="840" height="220" rx="14" fill="url(#bg)"/>
  <rect x="0" y="0" width="840" height="220" rx="14" fill="none" stroke="#2a3550" stroke-width="1"/>

  <!-- title bar -->
  <g>
    <circle cx="26" cy="26" r="6" fill="#ff5f56"/>
    <circle cx="48" cy="26" r="6" fill="#ffbd2e"/>
    <circle cx="70" cy="26" r="6" fill="#27c93f"/>
    <text x="420" y="30" text-anchor="middle" class="mono" font-size="12" fill="#5b6784">karan@github: ~/profile</text>
  </g>
  <line x1="0" y1="48" x2="840" y2="48" stroke="#2a3550" stroke-width="1"/>

  <!-- body -->
  <g class="mono" font-size="17">
    <text x="28" y="88" fill="#5b6784">karan@github <tspan fill="#38e1c4">~</tspan> $ <tspan fill="#e8edf7">whoami</tspan></text>

    <g class="line l1"><text x="28" y="120"><tspan fill="#38e1c4">▸ </tspan><tspan fill="#e8edf7" font-size="22" font-weight="700">Karan Nishchal</tspan><tspan fill="#94a2bd" font-size="16"> — Data Scientist / ML Engineer</tspan></text></g>

    <g class="line l2"><text x="28" y="150"><tspan fill="#6a8cff">stack </tspan><tspan fill="#94a2bd">→ Python · PyTorch · scikit-learn · NLP/GenAI · RAG · SQL · MLOps</tspan></text></g>

    <g class="line l3"><text x="28" y="176"><tspan fill="#c774ff">focus </tspan><tspan fill="#94a2bd">→ predictive modelling · LLM apps · data-centric AI</tspan></text></g>

    <g class="line l4"><text x="28" y="202"><tspan fill="#5b6784">loc   → London, UK  ·  MSc Data Science</tspan><tspan class="cursor" fill="#38e1c4" font-size="20"> █</tspan></text></g>
  </g>

  <!-- accent underline -->
  <rect x="28" y="58" width="230" height="2" fill="url(#accent)" class="type1"/>
</svg>
