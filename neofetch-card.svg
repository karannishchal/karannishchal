<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320" role="img" aria-label="Karan Nishchal — neofetch card">
  <defs>
    <linearGradient id="nbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e18"/><stop offset="1" stop-color="#0f1626"/>
    </linearGradient>
    <linearGradient id="nacc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38e1c4"/><stop offset="0.55" stop-color="#6a8cff"/><stop offset="1" stop-color="#c774ff"/>
    </linearGradient>
    <style>
      .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;}
      .r{opacity:1;}
      .r0{animation:fin .5s ease .2s both;} .r1{animation:fin .5s ease .55s both;}
      .r2{animation:fin .5s ease .9s both;} .r3{animation:fin .5s ease 1.25s both;}
      .r4{animation:fin .5s ease 1.6s both;} .r5{animation:fin .5s ease 1.95s both;}
      .r6{animation:fin .5s ease 2.3s both;} .r7{animation:fin .5s ease 2.65s both;}
      .r8{animation:fin .5s ease 3.0s both;}
      @keyframes fin{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:translateX(0);}}
      .node{animation:pulse 2.6s ease-in-out infinite;}
      @keyframes pulse{0%,100%{opacity:.55;} 50%{opacity:1;}}
      .edge{stroke-dasharray:120;stroke-dashoffset:0;animation:draw 1.6s ease .2s both;}
      @keyframes draw{from{stroke-dashoffset:120;}to{stroke-dashoffset:0;}}
    </style>
  </defs>

  <rect x="0" y="0" width="860" height="320" rx="14" fill="url(#nbg)"/>
  <rect x="0.5" y="0.5" width="859" height="319" rx="14" fill="none" stroke="#2a3550"/>

  <!-- ===== left: neural-net emblem ===== -->
  <g stroke="url(#nacc)" stroke-width="1.4" opacity="0.9">
    <!-- edges L1->L2 -->
    <g fill="none">
      <line class="edge" x1="70" y1="90" x2="150" y2="70"/>
      <line class="edge" x1="70" y1="90" x2="150" y2="130"/>
      <line class="edge" x1="70" y1="150" x2="150" y2="70"/>
      <line class="edge" x1="70" y1="150" x2="150" y2="130"/>
      <line class="edge" x1="70" y1="150" x2="150" y2="190"/>
      <line class="edge" x1="70" y1="210" x2="150" y2="130"/>
      <line class="edge" x1="70" y1="210" x2="150" y2="190"/>
      <!-- edges L2->L3 -->
      <line class="edge" x1="150" y1="70" x2="230" y2="110"/>
      <line class="edge" x1="150" y1="130" x2="230" y2="110"/>
      <line class="edge" x1="150" y1="130" x2="230" y2="170"/>
      <line class="edge" x1="150" y1="190" x2="230" y2="170"/>
    </g>
  </g>
  <g>
    <!-- layer 1 -->
    <circle class="node" cx="70" cy="90"  r="7" fill="#38e1c4"/>
    <circle class="node" cx="70" cy="150" r="7" fill="#38e1c4"/>
    <circle class="node" cx="70" cy="210" r="7" fill="#38e1c4"/>
    <!-- layer 2 -->
    <circle class="node" cx="150" cy="70"  r="7" fill="#6a8cff"/>
    <circle class="node" cx="150" cy="130" r="7" fill="#6a8cff"/>
    <circle class="node" cx="150" cy="190" r="7" fill="#6a8cff"/>
    <!-- layer 3 -->
    <circle class="node" cx="230" cy="110" r="7" fill="#c774ff"/>
    <circle class="node" cx="230" cy="170" r="7" fill="#c774ff"/>
  </g>
  <text x="150" y="262" text-anchor="middle" class="mono" font-size="12" fill="#5b6784">// forward pass</text>

  <!-- ===== right: neofetch info ===== -->
  <g class="mono">
    <text x="310" y="52" font-size="17"><tspan fill="#38e1c4" font-weight="700">karan</tspan><tspan fill="#5b6784">@</tspan><tspan fill="#6a8cff" font-weight="700">github</tspan></text>
    <text x="310" y="70" font-size="14" fill="#2a3550">──────────────────────────────</text>

    <g font-size="14.5">
      <g class="r r0"><text x="310" y="98"><tspan fill="#38e1c4">Role      </tspan><tspan fill="#94a2bd">: Data Scientist / ML Engineer</tspan></text></g>
      <g class="r r1"><text x="310" y="122"><tspan fill="#6a8cff">Uptime    </tspan><tspan fill="#94a2bd">: 6+ yrs — engineering &amp; analytics</tspan></text></g>
      <g class="r r2"><text x="310" y="146"><tspan fill="#c774ff">Education </tspan><tspan fill="#94a2bd">: MSc Data Science, Middlesex Uni</tspan></text></g>
      <g class="r r3"><text x="310" y="170"><tspan fill="#38e1c4">Languages </tspan><tspan fill="#94a2bd">: Python · SQL · Java · Bash</tspan></text></g>
      <g class="r r4"><text x="310" y="194"><tspan fill="#6a8cff">ML / DL   </tspan><tspan fill="#94a2bd">: PyTorch · TensorFlow · sklearn · XGBoost</tspan></text></g>
      <g class="r r5"><text x="310" y="218"><tspan fill="#c774ff">GenAI     </tspan><tspan fill="#94a2bd">: LLMs · RAG · FAISS · embeddings</tspan></text></g>
      <g class="r r6"><text x="310" y="242"><tspan fill="#38e1c4">Focus     </tspan><tspan fill="#94a2bd">: data-centric AI · LLM apps · MLOps</tspan></text></g>
      <g class="r r7"><text x="310" y="266"><tspan fill="#6a8cff">Location  </tspan><tspan fill="#94a2bd">: London, UK  ·  open to roles</tspan></text></g>
    </g>
  </g>

  <!-- neofetch color squares -->
  <g class="r r8">
    <rect x="310" y="284" width="20" height="14" rx="2" fill="#38e1c4"/>
    <rect x="336" y="284" width="20" height="14" rx="2" fill="#6a8cff"/>
    <rect x="362" y="284" width="20" height="14" rx="2" fill="#c774ff"/>
    <rect x="388" y="284" width="20" height="14" rx="2" fill="#ff5f56"/>
    <rect x="414" y="284" width="20" height="14" rx="2" fill="#ffbd2e"/>
    <rect x="440" y="284" width="20" height="14" rx="2" fill="#27c93f"/>
    <rect x="466" y="284" width="20" height="14" rx="2" fill="#e8edf7"/>
    <rect x="492" y="284" width="20" height="14" rx="2" fill="#5b6784"/>
  </g>
</svg>
